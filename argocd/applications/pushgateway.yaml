apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pushgateway
spec:
  destination:
    namespace: mlflow
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    targetRevision: 2.4.2
    helm:
      valuesObject:
        service:
          type: ClusterIP
          port: 9091
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
