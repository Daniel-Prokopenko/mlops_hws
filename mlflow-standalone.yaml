apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-standalone
  namespace: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow-standalone
  template:
    metadata:
      labels:
        app: mlflow-standalone
    spec:
      containers:
      - name: mlflow
        image: python:3.9-slim
        command:
          - /bin/bash
          - -c
          - |
            pip install mlflow psycopg2-binary boto3
            mlflow server \
              --backend-store-uri postgresql://mlflow:mlflowpass@postgres-simple.mlflow.svc.cluster.local:5432/mlflow \
              --artifacts-destination s3://mlflow-artifacts \
              --serve-artifacts \
              --host 0.0.0.0 \
              --port 5000
        ports:
        - containerPort: 5000
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "minio"
        - name: AWS_SECRET_ACCESS_KEY
          value: "minio123"
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://minio.mlflow.svc.cluster.local:9000"
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-standalone
  namespace: mlflow
spec:
  selector:
    app: mlflow-standalone
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
