stages: [train]

train-model:
  stage: train
  image:
    name: amazon/aws-cli:2.15.0
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
  script:
    - aws --version
    - aws sts get-caller-identity --region "$AWS_REGION"
    - aws stepfunctions start-execution --region "$AWS_REGION" --state-machine-arn "$STATE_MACHINE_ARN" --name "train-$CI_PIPELINE_ID-$CI_COMMIT_SHORT_SHA" --input "{\"source\":\"gitlab-ci\",\"commit\":\"$CI_COMMIT_SHORT_SHA\"}"
