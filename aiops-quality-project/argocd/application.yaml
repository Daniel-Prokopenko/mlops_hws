apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aiops-quality-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Daniel-Prokopenko/mlops_hws.git
    targetRevision: final-project
    path: aiops-quality-project/helm
    helm:
      releaseName: aiops-quality
  destination:
    server: https://kubernetes.default.svc
    namespace: aiops-quality
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
